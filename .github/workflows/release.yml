name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Build
        run: ./gradlew build --no-daemon --no-parallel
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4G
      - name: Collect jars
        run: |
          mkdir -p dist
          find versions -path '*/build/libs/cargoghast-*.jar' ! -name '*-sources.jar' -print -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls -A dist/*.jar 2>/dev/null)"
      - name: Release notes
        id: notes
        run: |
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          {
            echo "body<<EOF"
            if [ -n "$notes" ]; then
              printf '%s\n' "$notes"
            else
              echo "Cargo Ghast ${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: Cargo Ghast ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: false
